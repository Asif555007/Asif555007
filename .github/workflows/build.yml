name: Build APK
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Installs Gradle itself, so this works even if gradlew was not uploaded.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Locate project folder
        id: loc
        run: |
          f=$(find . -name settings.gradle.kts -not -path "*/node_modules/*" | head -n1)
          if [ -z "$f" ]; then echo "settings.gradle.kts not found. Files in repo:"; find . -maxdepth 3 -not -path "./.git/*" | head -50; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle testDebugUnitTest --stacktrace
      - name: Build debug APK
        working-directory: ${{ steps.loc.outputs.dir }}
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BDKeyboardPro-debug-apk
          path: "**/build/outputs/apk/debug/app-debug.apk"
